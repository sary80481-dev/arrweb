<style>
  .ds { position: relative; width: 800px; height: 600px; font-family: 'Oswald', sans-serif; text-align: center; color: #fff;
        background: radial-gradient(circle at 50% 45%, rgba(127, 29, 29, .6), rgba(0, 0, 0, .95) 70%); }
  .ds-inner { position: absolute; top: 140px; left: 0; right: 0; }
  .ds-title { margin: 0; font-size: 64px; letter-spacing: 8px; color: #ef4444; text-shadow: 0 0 20px #7f1d1d; }
  .ds-by { font-family: 'Inter', sans-serif; font-size: 15px; color: #fca5a5; margin: 8px 0 26px; }
  .ds-stats { display: flex; justify-content: center; gap: 14px; margin-bottom: 30px; }
  .ds-stat { width: 120px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
  .ds-num { font-size: 26px; color: #fde68a; }
  .ds-lbl { font-family: 'Inter', sans-serif; font-size: 11px; color: #d4d4d8; text-transform: uppercase; letter-spacing: 1px; }
  .ds-row { display: flex; justify-content: center; gap: 12px; }
  .ds-respawn { padding: 14px 40px; border-radius: 12px; border: 0; font-family: 'Oswald', sans-serif; font-size: 20px;
                letter-spacing: 2px; cursor: pointer; background: linear-gradient(180deg, #ef4444, #991b1b); color: #fff; }
  .ds-revive { padding: 14px 26px; border-radius: 12px; border: 2px solid #fbbf24; background: transparent; color: #fde68a;
               font-family: 'Oswald', sans-serif; font-size: 16px; cursor: pointer; }
</style>
<div class="ds">
  <div class="ds-inner">
    <h1 class="ds-title">YOU DIED</h1>
    <div class="ds-by">Dikalahkan oleh <b>Shadow Knight</b> · Lv. 40</div>
    <div class="ds-stats">
      <div class="ds-stat"><div class="ds-num">12</div><div class="ds-lbl">Kills</div></div>
      <div class="ds-stat"><div class="ds-num">08:42</div><div class="ds-lbl">Survived</div></div>
      <div class="ds-stat"><div class="ds-num">+340</div><div class="ds-lbl">XP</div></div>
    </div>
    <div class="ds-row">
      <button class="ds-revive" id="revive-btn">Revive · 💎 20</button>
      <button class="ds-respawn" id="respawn-btn">RESPAWN</button>
    </div>
  </div>
</div>
