<style>
  .pc { width: 380px; margin: 60px auto; border-radius: 22px; overflow: hidden; font-family: 'Poppins', sans-serif;
        background: #0f172a; color: #e2e8f0; border: 1px solid #1e293b; }
  .pc-cover { height: 110px; background: linear-gradient(120deg, #06b6d4, #8b5cf6, #ec4899); }
  .pc-body { padding: 0 22px 22px; text-align: center; }
  .pc-avatar { width: 92px; height: 92px; margin: -46px auto 10px; border-radius: 50%; border: 5px solid #0f172a;
               background: linear-gradient(135deg, #f59e0b, #ef4444); display: flex; align-items: center; justify-content: center;
               font-size: 44px; }
  .pc-name { font-size: 22px; font-weight: 800; margin: 0; }
  .pc-tag { font-size: 13px; color: #94a3b8; margin-bottom: 14px; }
  .pc-badges { display: flex; justify-content: center; gap: 6px; margin-bottom: 16px; }
  .pc-badge { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #1e293b; }
  .pc-badge.vip { background: linear-gradient(90deg, #fbbf24, #f59e0b); color: #1c1917; }
  .pc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
  .pc-stat { padding: 10px 4px; border-radius: 12px; background: #1e293b; }
  .pc-num { font-size: 18px; font-weight: 800; color: #fff; }
  .pc-lbl { font-size: 11px; color: #94a3b8; }
  .pc-row { display: flex; gap: 8px; }
  .pc-add { flex: 1; padding: 11px; border-radius: 10px; border: 0; font-weight: 700; cursor: pointer;
            background: linear-gradient(90deg, #06b6d4, #8b5cf6); color: #fff; }
  .pc-trade { flex: 1; padding: 11px; border-radius: 10px; border: 1px solid #334155; background: transparent; color: #cbd5e1;
              font-weight: 700; cursor: pointer; }
</style>
<div class="pc">
  <div class="pc-cover"></div>
  <div class="pc-body">
    <div class="pc-avatar">🐯</div>
    <h2 class="pc-name">TigerStrike</h2>
    <div class="pc-tag">@tigerstrike · Bergabung 2023</div>
    <div class="pc-badges"><span class="pc-badge vip">⭐ VIP</span><span class="pc-badge">🏆 Top 100</span><span class="pc-badge">🎯 Sniper</span></div>
    <div class="pc-stats">
      <div class="pc-stat"><div class="pc-num">1,284</div><div class="pc-lbl">Wins</div></div>
      <div class="pc-stat"><div class="pc-num">52</div><div class="pc-lbl">Level</div></div>
      <div class="pc-stat"><div class="pc-num">3.4</div><div class="pc-lbl">K/D</div></div>
    </div>
    <div class="pc-row">
      <button class="pc-add" id="friend-btn">+ Add Friend</button>
      <button class="pc-trade" id="trade-btn">⇄ Trade</button>
    </div>
  </div>
</div>
