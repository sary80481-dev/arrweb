<style>
  .cr { width: 640px; margin: 40px auto; padding: 22px; border-radius: 16px; font-family: 'Ubuntu', sans-serif;
        background: linear-gradient(180deg, #1c1917, #0c0a09); color: #e7e5e4; border: 1px solid #44403c; }
  .cr-title { margin: 0 0 14px; font-size: 22px; }
  .cr-main { display: flex; gap: 18px; align-items: center; }
  .cr-mats { display: grid; grid-template-columns: repeat(2, 72px); gap: 10px; }
  .cr-slot { width: 72px; height: 72px; border-radius: 12px; background: #292524; border: 2px solid #57534e; display: flex;
             flex-direction: column; align-items: center; justify-content: center; font-size: 28px; }
  .cr-slot small { font-size: 11px; color: #a8a29e; font-weight: 700; }
  .cr-slot.ok { border-color: #65a30d; }
  .cr-slot.miss { border-color: #b91c1c; }
  .cr-arrow { font-size: 34px; color: #a8a29e; }
  .cr-result { flex: 1; padding: 18px; border-radius: 14px; text-align: center; background: linear-gradient(180deg, #365314, #1a2e05);
               border: 1px solid #84cc16; }
  .cr-result-icon { font-size: 54px; }
  .cr-result-name { font-size: 18px; font-weight: 700; margin-top: 6px; color: #d9f99d; }
  .cr-result-desc { font-size: 12px; color: #bef264; margin-top: 4px; }
  .cr-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .cr-note { font-size: 12px; color: #fca5a5; }
  .cr-btn { padding: 12px 34px; border-radius: 10px; border: 0; font-size: 16px; font-weight: 700; cursor: pointer;
            background: linear-gradient(180deg, #84cc16, #4d7c0f); color: #fff; }
</style>
<div class="cr">
  <h2 class="cr-title">🔨 Crafting Table</h2>
  <div class="cr-main">
    <div class="cr-mats">
      <div class="cr-slot ok">🪵<small>4/4</small></div>
      <div class="cr-slot ok">🪨<small>2/2</small></div>
      <div class="cr-slot ok">🧵<small>1/1</small></div>
      <div class="cr-slot miss">💠<small>0/1</small></div>
    </div>
    <div class="cr-arrow">➜</div>
    <div class="cr-result">
      <div class="cr-result-icon">🏹</div>
      <div class="cr-result-name">Hunter Bow</div>
      <div class="cr-result-desc">+25 Damage · Rare</div>
    </div>
  </div>
  <div class="cr-foot">
    <div class="cr-note">Kurang 1 Crystal Shard</div>
    <button class="cr-btn" id="craft-btn">Craft</button>
  </div>
</div>
