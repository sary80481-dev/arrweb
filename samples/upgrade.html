<style>
  .up { width: 600px; margin: 50px auto; padding: 24px; border-radius: 18px; font-family: 'Oswald', sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; border: 1px solid #334155; }
  .up-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .up-title { font-size: 26px; margin: 0; letter-spacing: 1px; text-transform: uppercase; }
  .up-balance { padding: 8px 14px; border-radius: 10px; background: #1e293b; border: 1px solid #fbbf24; color: #fde68a; font-weight: 700; }
  .up-item { display: flex; gap: 18px; align-items: center; padding: 18px; border-radius: 14px; background: rgba(255,255,255,.04);
             border: 1px solid #334155; }
  .up-icon { width: 96px; height: 96px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
             font-size: 52px; background: linear-gradient(135deg, #dc2626, #7f1d1d); }
  .up-info { flex: 1; }
  .up-name { font-size: 22px; color: #fca5a5; }
  .up-lv { font-size: 13px; color: #94a3b8; font-family: 'Inter', sans-serif; margin: 2px 0 10px; }
  .up-stat { display: flex; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 13px; padding: 4px 0;
             border-bottom: 1px dashed #334155; }
  .up-stat .next { color: #4ade80; font-weight: 700; }
  .up-foot { display: flex; justify-content: flex-end; gap: 12px; margin-top: 18px; }
  .up-btn { padding: 13px 30px; border-radius: 10px; border: 0; font-family: 'Oswald', sans-serif; font-size: 17px; cursor: pointer;
            letter-spacing: 1px; background: linear-gradient(180deg, #f59e0b, #b45309); color: #fff; }
  .up-sell { padding: 13px 22px; border-radius: 10px; border: 1px solid #475569; background: transparent; color: #cbd5e1;
             font-family: 'Oswald', sans-serif; font-size: 15px; cursor: pointer; }
</style>
<div class="up">
  <div class="up-head">
    <h2 class="up-title">⚒️ Forge</h2>
    <div class="up-balance">🪙 5,200 Coins</div>
  </div>
  <div class="up-item">
    <div class="up-icon">🗡️</div>
    <div class="up-info">
      <div class="up-name">Blazing Katana</div>
      <div class="up-lv">Level 7 → 8 · Epic</div>
      <div class="up-stat"><span>Damage</span><span>140 <span class="next">→ 158</span></span></div>
      <div class="up-stat"><span>Crit Chance</span><span>12% <span class="next">→ 14%</span></span></div>
      <div class="up-stat"><span>Speed</span><span>1.2 <span class="next">→ 1.3</span></span></div>
    </div>
  </div>
  <div class="up-foot">
    <button class="up-sell" id="sell-btn">Sell</button>
    <button class="up-btn" id="upgrade-btn">Upgrade · 🪙 900</button>
  </div>
</div>
