<style>
  .rc { width: 460px; margin: 90px auto; padding: 30px; border-radius: 18px; font-family: 'Inter', sans-serif;
        background: #0b1220; color: #e2e8f0; border: 1px solid #1e3a8a;
        box-shadow: 0 20px 60px rgba(30, 64, 175, .35); }
  .rc-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 700;
              letter-spacing: 1px; background: #1e3a8a; color: #93c5fd; }
  .rc h2 { margin: 12px 0 6px; font-size: 24px; color: #fff; }
  .rc p { margin: 0 0 20px; font-size: 13px; color: #94a3b8; line-height: 1.5; }
  .rc-input { width: 100%; padding: 14px 16px; border-radius: 10px; border: 2px solid #334155; background: #111827;
              color: #fff; font-size: 16px; font-weight: 600; letter-spacing: 2px; }
  .rc-row { display: flex; gap: 10px; margin-top: 12px; }
  .rc-btn { flex: 1; padding: 13px; border-radius: 10px; border: 0; font-weight: 800; font-size: 14px; cursor: pointer;
            background: linear-gradient(90deg, #2563eb, #7c3aed); color: #fff; }
  .rc-cancel { flex: 0 0 110px; padding: 13px; border-radius: 10px; border: 1px solid #334155; background: transparent;
               color: #cbd5e1; font-weight: 600; cursor: pointer; }
  .rc-hint { margin-top: 18px; padding: 12px; border-radius: 10px; background: rgba(34, 197, 94, .08);
             border-left: 3px solid #22c55e; font-size: 12px; color: #86efac; }
</style>
<div class="rc">
  <span class="rc-badge">CODES</span>
  <h2>🎟️ Redeem Code</h2>
  <p>Masukkan kode dari <strong>Discord</strong> atau <em>event</em> untuk dapat hadiah gratis.</p>
  <input class="rc-input" id="code-input" placeholder="Contoh: WELCOME">
  <div class="rc-row">
    <button class="rc-btn" id="redeem-btn">Redeem</button>
    <button class="rc-cancel" id="rc-close">Close</button>
  </div>
  <div class="rc-hint">✅ Kode aktif: WELCOME — dapat 250 koin</div>
</div>
