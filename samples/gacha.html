<style>
  .gc { width: 560px; margin: 40px auto; padding: 26px; border-radius: 22px; text-align: center; font-family: 'Nunito', sans-serif;
        background: radial-gradient(circle at 50% 30%, #7c3aed 0%, #3b0764 60%, #1e0535 100%); color: #fff;
        border: 2px solid #c084fc; }
  .gc-title { font-size: 30px; font-weight: 900; margin: 0; letter-spacing: 1px; }
  .gc-sub { font-size: 13px; color: #e9d5ff; margin: 6px 0 18px; }
  .gc-wheel { width: 220px; height: 220px; margin: 0 auto 18px; border-radius: 50%; border: 8px solid #fde047;
              background: linear-gradient(135deg, #f472b6, #a78bfa 50%, #60a5fa); display: flex; align-items: center;
              justify-content: center; font-size: 72px; }
  .gc-odds { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .gc-odd { padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; background: rgba(0,0,0,.3); }
  .gc-odd.common { color: #d1d5db; } .gc-odd.rare { color: #60a5fa; } .gc-odd.legend { color: #fbbf24; }
  .gc-row { display: flex; gap: 12px; justify-content: center; }
  .gc-spin { padding: 14px 34px; border-radius: 14px; border: 0; cursor: pointer; font-size: 18px; font-weight: 900;
             background: linear-gradient(180deg, #fde047, #f59e0b); color: #422006; }
  .gc-cost { align-self: center; padding: 10px 14px; border-radius: 10px; background: rgba(0,0,0,.35); font-weight: 800; }
</style>
<div class="gc">
  <h2 class="gc-title">✨ LUCKY SPIN ✨</h2>
  <div class="gc-sub">Putar roda dan menangkan hadiah langka!</div>
  <div class="gc-wheel">🎰</div>
  <div class="gc-odds">
    <span class="gc-odd common">Common 60%</span>
    <span class="gc-odd rare">Rare 30%</span>
    <span class="gc-odd legend">Legendary 10%</span>
  </div>
  <div class="gc-row">
    <div class="gc-cost">💎 250 Gems</div>
    <button class="gc-spin" id="spin-btn">SPIN</button>
  </div>
</div>
